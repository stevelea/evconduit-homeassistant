set_charging:
  name: Set Charging
  description: Start or stop charging the vehicle.
  fields:
    action:
      name: Action
      description: The charging action to perform.
      required: true
      example: "START"
      selector:
        select:
          options:
            - "START"
            - "STOP"

update_odometer:
  name: Update Odometer
  description: Update the odometer reading for the latest charging session. Use this to record odometer from OBD or other sources after a charge completes. Provide either an entity or a direct value.
  fields:
    odometer_entity:
      name: Odometer Entity
      description: Select a sensor entity that contains the odometer reading (in km).
      required: false
      example: "sensor.obd_odometer"
      selector:
        entity:
          domain: sensor
    odometer_km:
      name: Odometer Value (km)
      description: Direct odometer reading in kilometers. Used if no entity is selected.
      required: false
      example: 45000
      selector:
        number:
          min: 0
          max: 1000000
          step: 1
          unit_of_measurement: "km"
          mode: box

send_abrp_telemetry:
  name: Send ABRP Telemetry
  description: Force send current vehicle telemetry to A Better Route Planner. Requires ABRP token to be configured.

post_charging_session:
  name: Post Charging Session
  description: Record a completed charging session with EVConduit. vehicle_id and API key are taken from the integration config automatically.
  fields:
    start_time:
      name: Start Time
      description: ISO 8601 timestamp when charging started.
      required: true
      example: "2026-05-15T18:30:00+10:00"
      selector:
        text:
    end_time:
      name: End Time
      description: ISO 8601 timestamp when charging stopped.
      required: true
      example: "2026-05-15T20:45:00+10:00"
      selector:
        text:
    start_battery_level:
      name: Start Battery Level
      description: Battery SOC (%) at session start.
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    end_battery_level:
      name: End Battery Level
      description: Battery SOC (%) at session end.
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    energy_added_kwh:
      name: Energy Added (kWh)
      description: Energy added during session. Auto-computed from battery delta when omitted.
      required: false
      selector:
        number:
          min: 0
          max: 200
          step: 0.01
          unit_of_measurement: kWh
    latitude:
      name: Latitude
      description: Charging location latitude. Used for OCM station lookup.
      required: false
      selector:
        number:
          min: -90
          max: 90
          # `any`, not a step: Home Assistant rejects a `step` below 1e-3
          # (helpers/selector.py), and one that fine is wanted here — a
          # coordinate needs six decimals to name a parking space. A rejected
          # `step` does not just degrade this field: the whole services.yaml
          # fails to parse, so every service in this integration loses its
          # description in the UI.
          step: any
    longitude:
      name: Longitude
      description: Charging location longitude. Used for OCM station lookup.
      required: false
      selector:
        number:
          min: -180
          max: 180
          step: any
    odometer_km:
      name: Odometer (km)
      description: Vehicle odometer reading at end of session.
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          unit_of_measurement: km

push_vehicle_state:
  name: Push Vehicle State
  description: Write values straight into the EVConduit vehicle cache. Keys are dotted cache paths such as chargeState.batteryLevel, location.latitude or abrp_extra.tire_pressure_fl, and each value is stored at that path. A path the backend does not recognise, or will not let you write, fails the whole call and nothing is written.
  fields:
    fields:
      name: Fields
      description: 'Mapping of dotted vehicle-cache paths to the value to store at each one, for example {"chargeState.batteryLevel": 72, "location.latitude": -33.8688}.'
      required: true
      example: '{"chargeState.batteryLevel": 72, "location.latitude": -33.8688}'
      selector:
        object:
    observed_at:
      name: Observed At
      description: ISO 8601 timestamp of when the readings were taken. Use it to backfill a reading from earlier; leave it out to store the values as of now.
      required: false
      example: "2026-10-05T08:30:00+11:00"
      selector:
        text:
